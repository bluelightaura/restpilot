[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restpilot"
version = "0.1.0"
description = "A CLI tool to explore, call and test REST APIs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "RestPilot contributors" }]
keywords = ["rest", "api", "cli", "openapi", "testing", "pytest", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
restpilot = "restpilot.cli:app"

[tool.setuptools.packages.find]
include = ["restpilot*"]

[tool.setuptools.package-data]
restpilot = ["generators/templates/*.j2", "py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
python_classes = ["*TestCase"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=restpilot",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "unit: isolated tests without I/O",
    "integration: tests exercising the HTTP client against a mocked transport",
    "cli: end-to-end tests of the command line interface",
]

[tool.coverage.run]
branch = true
source = ["restpilot"]
omit = ["*/generators/templates/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["generated_tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "D", "ANN", "S"]
ignore = [
    "D203",
    "D213",
    "ANN401",
    # Tests assert; the generated modules assert too.
    "S101",
    # `str, Enum` keeps the values JSON-serializable on every supported version.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call expressions in argument defaults by design.
"restpilot/cli.py" = ["B008"]
"tests/*" = ["D103", "D100", "D104", "ANN001", "ANN201", "S105", "S106"]
"examples/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["restpilot", "tests"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

# Copy this file to .restpilot.yaml in your project root.
# The local file always takes precedence over ~/.config/restpilot/config.yaml.
# Never write literal secrets here: use ${VAR} placeholders instead.

current_environment: local

environments:
  local:
    base_url: http://localhost:8000
    timeout: 10
    verify_ssl: true
    headers:
      Accept: application/json
      Authorization: Bearer ${RESTPILOT_TOKEN}

  stage:
    base_url: https://stage.example.com
    timeout: 20
    verify_ssl: true
    headers:
      Accept: application/json
      X-API-Key: ${RESTPILOT_STAGE_KEY}
